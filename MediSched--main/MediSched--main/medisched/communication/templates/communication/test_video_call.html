<!DOCTYPE html>
<html>
<head>
    <title>Video Call Test</title>
</head>
<body>
    <h1>Video Call System Test</h1>
    
    <h2>Configuration Status:</h2>
    <ul>
        <li>Agora App ID: <strong>{{ agora_app_id }}</strong></li>
        <li>Agora Certificate: <strong>{{ agora_certificate }}</strong></li>
        <li>Token Builder Available: <strong>{{ token_builder_available }}</strong></li>
    </ul>
    
    <h2>Test Token Generation:</h2>
    <form method="post" action="{% url 'communication:test_token' %}">
        {% csrf_token %}
        <label>Channel Name: <input type="text" name="channel" value="test_channel"></label><br>
        <label>User ID: <input type="number" name="uid" value="123"></label><br>
        <button type="submit">Generate Test Token</button>
    </form>
</body>
</html>
